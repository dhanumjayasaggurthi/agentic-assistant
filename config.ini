# ──────────────────────────────────────────────────────────────────────────────
# GenAI API Marketplace — API Keys & Endpoints
# All endpoints confirmed from marketplace card sample code.
# Leave api_key as YOUR_* to skip those models in the test run.
# ──────────────────────────────────────────────────────────────────────────────

# Card: "Azure OpenAI Chat Completion"
# Path pattern: /openai/deployments/{model}/chat/completions
[azure_chat]
api_key     = YOUR_AZURE_CHAT_API_KEY
endpoint    = https://genaiapimna.jnj.com/openai-chat
api_version = 2024-12-01-preview

# Card: "Azure OpenAI GPT-5"  (GPT-5 family + all Codex models + o3 reasoning)
# Path pattern: /openai/deployments/{model}/chat/completions
[azure_gpt5]
api_key     = YOUR_AZURE_GPT5_API_KEY
endpoint    = https://genaiapimna.jnj.com/openai-gpt-5
api_version = 2024-10-21

# Card: "Azure OpenAI Embedding"
# Path pattern: /openai/deployments/{model}/embeddings
# NOTE: api_version must be 2022-12-01 for embeddings
[azure_embedding]
api_key     = YOUR_AZURE_EMBEDDING_API_KEY
endpoint    = https://genaiapimna.jnj.com/openai-embeddings
api_version = 2022-12-01

# Card: "Azure OpenAI Image Generation"
# Path pattern: /openai/deployments/{model}/images/generations
[azure_image]
api_key     = YOUR_AZURE_IMAGE_API_KEY
endpoint    = https://genaiapimna.jnj.com/openai-image
api_version = 2024-10-21

# Card: "Azure OpenAI Audio"
# Path pattern: /openai/deployments/{model}/audio/{speech|transcriptions}
# NOTE: Same base URL as openai-chat but SEPARATE API KEY
[azure_audio]
api_key     = YOUR_AZURE_AUDIO_API_KEY
endpoint    = https://genaiapimna.jnj.com/openai-audio
api_version = 2025-03-01-preview

# Card: "Azure OpenAI Completion"  (legacy — gpt-35-turbo-instruct only)
# Path pattern: /openai/deployments/{model}/completions
# NOTE: api_version is fixed at 2023-03-15-preview
[azure_completion]
api_key     = YOUR_AZURE_COMPLETION_API_KEY
endpoint    = https://genaiapimna.jnj.com/openai-completion
api_version = 2023-03-15-preview

# Card: "Amazon Bedrock"  (all Bedrock models share one endpoint + key)
[bedrock]
api_key  = YOUR_BEDROCK_API_KEY
endpoint = https://genaiapigwna.jnj.com

# Card: "Google Vertex AI"  (Gemini chat/text models)
[vertex]
api_key  = YOUR_VERTEX_API_KEY
endpoint = https://genaiapigcpna.jnj.com

# Card: "Google Vertex AI - Image"  (separate key; same base URL as [vertex])
# Full path: /v1/projects/GenAI/locations/us-east1/publishers/google/models/{model}:generateContent
[vertex_image]
api_key  = YOUR_VERTEX_IMAGE_API_KEY
endpoint = https://genaiapigcpna.jnj.com


# RDI AI Studio — Application Configuration

[sso]
; Azure AD / Entra ID app registration details
; Get tenant_id from: authority URL "https://login.microsoftonline.com/{tenant_id}"
; Get client_id from: Application (client) ID in Azure App Registration
tenant_id    = YOUR_TENANT_ID
client_id    = YOUR_CLIENT_ID
; redirect_uri is handled dynamically (window.location.origin) — this is only used for fallback
redirect_uri = http://localhost:8000
; Full scope list matching your team's msalConfig.js
scopes       = openid profile email User.Read User.Read.All Group.Read.All GroupMember.Read.All offline_access


