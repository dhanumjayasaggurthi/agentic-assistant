<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RDI AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23E11900'/><text x='16' y='23' text-anchor='middle' font-family='Georgia' font-size='19' font-weight='700' fill='white'>R</text></svg>" />

  <!-- Fonts: Newsreader (display serif) / Instrument Sans (UI) / IBM Plex Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="/static/css/app.css" />

  <!-- CDN: React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- CDN: Babel standalone (JSX without build step) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- CDN: Marked.js (Markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <!-- CDN: DOMPurify — sanitizes model-generated HTML before render (XSS guard) -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <!-- CDN: Prism.js (Syntax highlighting; theme colors overridden in app.css) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- CDN: MSAL Browser (Azure AD SSO) — jsDelivr is more accessible in corporate networks -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/dist/msal-browser.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Auth utilities (plain JS, no JSX) -->
  <script src="/static/js/auth.js"></script>
  <!-- WebSocket client with auto-reconnect + stream resume (plain JS, no JSX) -->
  <script src="/static/js/ws.js"></script>
  <!-- Main React app (JSX via Babel) -->
  <script type="text/babel" src="/static/js/app.js"></script>
</body>
</html>
